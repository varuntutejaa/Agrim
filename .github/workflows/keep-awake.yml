# Keeps the free Render API awake during the judging period, so a visitor never
# waits 30-60 s for a sleeping server. Pings every 10 minutes between about
# 06:30 and 23:20 IST, and does nothing after 30 Nov 2026 (the free plan's
# monthly hours are shared with other services in the workspace).
# GitHub may run scheduled jobs a few minutes late; that's fine here.
name: Keep awake

on:
  schedule:
    - cron: "*/10 1-17 * * *"   # 01:00-17:50 UTC = 06:30-23:20 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API (until 30 Nov 2026)
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261130 ]; then
            echo "Judging window over; not pinging."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://agrim-api.onrender.com/health
          echo
          curl -fsS --max-time 90 -o /dev/null -w "forecast/latest: HTTP %{http_code}\n" https://agrim-api.onrender.com/forecast/latest
